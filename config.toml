# Copiar como .streamlit/config.toml en la raíz del repo.
[theme]
base = "light"
primaryColor = "#2E86DE"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#111827"

[client]
# Los errores con traceback no le dicen nada al presidente ni a los compañeros:
# la app ya convierte los fallos de Google Sheets en mensajes en español.
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
# El Sheet es la fuente de verdad; no hay archivos que subir salvo la carga masiva.
maxUploadSize = 10
enableXsrfProtection = true
